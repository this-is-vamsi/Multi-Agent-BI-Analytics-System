<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1060" viewBox="0 0 1680 1060" role="img" aria-labelledby="title desc">
  <title id="title">Level 2 Multi-Agent API and Kubernetes Deployment Architecture</title>
  <desc id="desc">A clean deployment-level diagram with straight connectors and no overlapping labels.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .boundary { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .cluster { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font: 700 18px Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .eyebrow { font: 600 18px Arial, sans-serif; fill: #2563eb; letter-spacing: 0; }
      .heading { font: 700 34px Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subheading { font: 400 17px Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .title { font: 700 17px Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .subtitle { font: 400 13.5px Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .arrow { stroke: #475569; stroke-width: 2.2; stroke-linecap: round; }
      .dashed { stroke-dasharray: 7 7; }
      .lane-text { font: 700 13px Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .note { font: 400 14px Arial, sans-serif; fill: #475569; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1680" height="1060"/>
  <text x="70" y="70" class="eyebrow">Level 2 Architecture</text>
  <text x="70" y="112" class="heading">API, UI, and Kubernetes Deployment View</text>
  <text x="70" y="146" class="subheading">Straight-line deployment view with UI, gateway, agent APIs, storage, and platform services.</text>

  <rect x="60" y="190" width="260" height="720" rx="16" class="boundary"/>
  <text x="88" y="226" class="boundary-title">Client Layer</text>
  <g>
<rect x="95" y="285" width="190" height="94" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="95" y="285" width="190" height="7" rx="3.5" fill="#2563eb"/>
<text x="190.0" y="321" text-anchor="middle" class="title">React UI</text>
<text x="190.0" y="350" text-anchor="middle" class="subtitle">chat, upload, report</text>
</g>
  <g>
<rect x="95" y="445" width="190" height="94" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="95" y="445" width="190" height="7" rx="3.5" fill="#2563eb"/>
<text x="190.0" y="481" text-anchor="middle" class="title">Streamlit UI</text>
<text x="190.0" y="510" text-anchor="middle" class="subtitle">internal demo app</text>
</g>

  <rect x="370" y="190" width="850" height="720" rx="16" class="cluster"/>
  <text x="398" y="226" class="boundary-title">Kubernetes Cluster</text>

  <g>
<rect x="420" y="285" width="230" height="104" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="420" y="285" width="230" height="7" rx="3.5" fill="#0f766e"/>
<text x="535.0" y="321" text-anchor="middle" class="title">Ingress / Gateway</text>
<text x="535.0" y="350" text-anchor="middle" class="subtitle">TLS, auth, routing</text>
</g>
  <g>
<rect x="420" y="515" width="230" height="112" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="420" y="515" width="230" height="7" rx="3.5" fill="#0891b2"/>
<text x="535.0" y="551" text-anchor="middle" class="title">Orchestrator API</text>
<text x="535.0" y="580" text-anchor="middle" class="subtitle">coordinates all agent APIs</text>
</g>

  <g>
<rect x="745" y="265" width="210" height="104" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="745" y="265" width="210" height="7" rx="3.5" fill="#0891b2"/>
<text x="850.0" y="301" text-anchor="middle" class="title">PM Agent API</text>
<text x="850.0" y="330" text-anchor="middle" class="subtitle">requirements and report</text>
</g>
  <g>
<rect x="745" y="440" width="210" height="104" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="745" y="440" width="210" height="7" rx="3.5" fill="#16a34a"/>
<text x="850.0" y="476" text-anchor="middle" class="title">BA Agent API</text>
<text x="850.0" y="505" text-anchor="middle" class="subtitle">planning and synthesis</text>
</g>
  <g>
<rect x="745" y="615" width="210" height="104" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="745" y="615" width="210" height="7" rx="3.5" fill="#f59e0b"/>
<text x="850.0" y="651" text-anchor="middle" class="title">DA Agent API</text>
<text x="850.0" y="680" text-anchor="middle" class="subtitle">analysis and charts</text>
</g>

  <g>
<rect x="1010" y="265" width="170" height="84" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="1010" y="265" width="170" height="7" rx="3.5" fill="#7c3aed"/>
<text x="1095.0" y="301" text-anchor="middle" class="title">Vector DB</text>
<text x="1095.0" y="330" text-anchor="middle" class="subtitle">RAG chunks</text>
</g>
  <g>
<rect x="1010" y="405" width="170" height="84" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="1010" y="405" width="170" height="7" rx="3.5" fill="#f59e0b"/>
<text x="1095.0" y="441" text-anchor="middle" class="title">Object Storage</text>
<text x="1095.0" y="470" text-anchor="middle" class="subtitle">uploads and charts</text>
</g>
  <g>
<rect x="1010" y="545" width="170" height="84" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="1010" y="545" width="170" height="7" rx="3.5" fill="#16a34a"/>
<text x="1095.0" y="581" text-anchor="middle" class="title">Metadata DB</text>
<text x="1095.0" y="610" text-anchor="middle" class="subtitle">runs and status</text>
</g>
  <g>
<rect x="1010" y="685" width="170" height="84" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="1010" y="685" width="170" height="7" rx="3.5" fill="#64748b"/>
<text x="1095.0" y="721" text-anchor="middle" class="title">Secrets</text>
<text x="1095.0" y="750" text-anchor="middle" class="subtitle">keys and config</text>
</g>

  <rect x="1270" y="190" width="350" height="720" rx="16" class="boundary"/>
  <text x="1298" y="226" class="boundary-title">External Platform Services</text>
  <g>
<rect x="1310" y="285" width="250" height="94" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="1310" y="285" width="250" height="7" rx="3.5" fill="#111827"/>
<text x="1435.0" y="321" text-anchor="middle" class="title">LLM Provider</text>
<text x="1435.0" y="350" text-anchor="middle" class="subtitle">chat and embeddings</text>
</g>
  <g>
<rect x="1310" y="445" width="250" height="94" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="1310" y="445" width="250" height="7" rx="3.5" fill="#64748b"/>
<text x="1435.0" y="481" text-anchor="middle" class="title">Observability</text>
<text x="1435.0" y="510" text-anchor="middle" class="subtitle">logs, metrics, traces</text>
</g>
  <g>
<rect x="1310" y="605" width="250" height="94" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="1310" y="605" width="250" height="7" rx="3.5" fill="#2563eb"/>
<text x="1435.0" y="641" text-anchor="middle" class="title">CI/CD Registry</text>
<text x="1435.0" y="670" text-anchor="middle" class="subtitle">images and manifests</text>
</g>
  <g>
<rect x="1310" y="765" width="250" height="94" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="1310" y="765" width="250" height="7" rx="3.5" fill="#0f766e"/>
<text x="1435.0" y="801" text-anchor="middle" class="title">Auth Provider</text>
<text x="1435.0" y="830" text-anchor="middle" class="subtitle">SSO and JWT</text>
</g>

  <text x="350" y="258" text-anchor="middle" class="lane-text">HTTPS</text>
  <line x1="285" y1="332" x2="420" y2="332" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="285" y1="492" x2="420" y2="332" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="535" y1="389" x2="535" y2="515" class="arrow" marker-end="url(#arrowhead)"/>

  <text x="700" y="250" text-anchor="middle" class="lane-text">Agent API Calls</text>
  <line x1="650" y1="571" x2="745" y2="317" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="571" x2="745" y2="492" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="571" x2="745" y2="667" class="arrow" marker-end="url(#arrowhead)"/>

  <text x="985" y="250" text-anchor="middle" class="lane-text">Shared Services</text>
  <line x1="955" y1="317" x2="1010" y2="307" class="arrow dashed" marker-end="url(#arrowhead)"/>
  <line x1="955" y1="492" x2="1010" y2="447" class="arrow dashed" marker-end="url(#arrowhead)"/>
  <line x1="955" y1="667" x2="1010" y2="447" class="arrow dashed" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="571" x2="1010" y2="587" class="arrow dashed" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="571" x2="1010" y2="727" class="arrow dashed" marker-end="url(#arrowhead)"/>

  <text x="1245" y="258" text-anchor="middle" class="lane-text">Platform Calls</text>
  <line x1="1180" y1="307" x2="1310" y2="332" class="arrow dashed" marker-end="url(#arrowhead)"/>
  <line x1="1180" y1="307" x2="1310" y2="492" class="arrow dashed" marker-end="url(#arrowhead)"/>
  <line x1="1180" y1="727" x2="1310" y2="812" class="arrow dashed" marker-end="url(#arrowhead)"/>
  <line x1="1180" y1="587" x2="1310" y2="492" class="arrow dashed" marker-end="url(#arrowhead)"/>

  <text x="850" y="770" text-anchor="middle" class="lane-text">BA and DA iterate through orchestrated API calls</text>
  <line x1="850" y1="615" x2="850" y2="544" class="arrow dashed" marker-end="url(#arrowhead)"/>
  <line x1="850" y1="440" x2="850" y2="369" class="arrow dashed" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="370" y="940" width="1250" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="400" y="974" class="note">Deployment principle: each agent is independently served by FastAPI and scaled as its own Kubernetes Deployment behind the orchestrator.</text>
  </g>
</svg>
