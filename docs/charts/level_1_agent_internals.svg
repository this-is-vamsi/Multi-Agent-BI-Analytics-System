<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Level 1 Multi-Agent Architecture with Agent Internals</title>
  <desc id="desc">A cleaner Level 1 architecture diagram showing inputs, three agents, shared context, data outputs, and the feedback loop.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .band { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; }
      .band-title { font: 700 17px Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .eyebrow { font: 600 18px Arial, sans-serif; fill: #2563eb; letter-spacing: 0; }
      .heading { font: 700 34px Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subheading { font: 400 17px Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .title { font: 700 18px Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .pill-text { font: 600 14px Arial, sans-serif; fill: #334155; letter-spacing: 0; }
      .label { font: 600 13px Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .arrow { stroke: #475569; stroke-width: 2.4; stroke-linecap: round; }
      .dashed { stroke-dasharray: 7 7; }
      .loop { fill: none; stroke: #64748b; stroke-width: 2.4; stroke-dasharray: 7 7; stroke-linecap: round; }
      .boundary { fill: #fefce8; stroke: #facc15; stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-text { font: 700 14px Arial, sans-serif; fill: #854d0e; letter-spacing: 0; }
      .note { font: 400 14px Arial, sans-serif; fill: #475569; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="940"/>
  <text x="70" y="70" class="eyebrow">Level 1 Architecture</text>
  <text x="70" y="112" class="heading">Agent Internals and Data Boundaries</text>
  <text x="70" y="146" class="subheading">A cleaner view of what each agent consumes and produces before the final client report.</text>

  <rect x="60" y="190" width="1480" height="118" rx="16" class="band"/>
  <text x="88" y="226" class="band-title">Inputs</text>
  <g>
<rect x="110" y="248" width="230" height="44" rx="22" fill="#ffffff" stroke="#d8dee8" stroke-width="1.5"/>
<circle cx="135" cy="270" r="7" fill="#2563eb"/>
<text x="154" y="276" class="pill-text">Client brief</text>
</g>
  <g>
<rect x="370" y="248" width="260" height="44" rx="22" fill="#ffffff" stroke="#d8dee8" stroke-width="1.5"/>
<circle cx="395" cy="270" r="7" fill="#2563eb"/>
<text x="414" y="276" class="pill-text">Meetings and emails</text>
</g>
  <g>
<rect x="660" y="248" width="260" height="44" rx="22" fill="#ffffff" stroke="#d8dee8" stroke-width="1.5"/>
<circle cx="685" cy="270" r="7" fill="#0891b2"/>
<text x="704" y="276" class="pill-text">Client history</text>
</g>
  <g>
<rect x="950" y="248" width="260" height="44" rx="22" fill="#ffffff" stroke="#d8dee8" stroke-width="1.5"/>
<circle cx="975" cy="270" r="7" fill="#7c3aed"/>
<text x="994" y="276" class="pill-text">Company product decks</text>
</g>
  <g>
<rect x="1240" y="248" width="230" height="44" rx="22" fill="#ffffff" stroke="#d8dee8" stroke-width="1.5"/>
<circle cx="1265" cy="270" r="7" fill="#f59e0b"/>
<text x="1284" y="276" class="pill-text">Uploaded files</text>
</g>

  <rect x="60" y="360" width="1480" height="252" rx="16" class="band"/>
  <text x="88" y="396" class="band-title">Agent Collaboration</text>
  <g>
<rect x="130" y="432" width="280" height="126" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="130" y="432" width="280" height="7" rx="3.5" fill="#0891b2"/>
<text x="270.0" y="470" text-anchor="middle" class="title">PM Agent</text>
<text x="270.0" y="501" text-anchor="middle" class="subtitle">Frames client problem and report</text>
<text x="270.0" y="520" text-anchor="middle" class="subtitle">angle</text>
</g>
  <g>
<rect x="520" y="432" width="280" height="126" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="520" y="432" width="280" height="7" rx="3.5" fill="#16a34a"/>
<text x="660.0" y="470" text-anchor="middle" class="title">BA Agent</text>
<text x="660.0" y="501" text-anchor="middle" class="subtitle">Turns requirements into analysis</text>
<text x="660.0" y="520" text-anchor="middle" class="subtitle">asks</text>
</g>
  <g>
<rect x="910" y="432" width="280" height="126" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="910" y="432" width="280" height="7" rx="3.5" fill="#f59e0b"/>
<text x="1050.0" y="470" text-anchor="middle" class="title">DA Agent</text>
<text x="1050.0" y="501" text-anchor="middle" class="subtitle">Runs Python analysis and charts</text>
</g>
  <g>
<rect x="1300" y="432" width="180" height="126" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="1300" y="432" width="180" height="7" rx="3.5" fill="#7c3aed"/>
<text x="1390.0" y="470" text-anchor="middle" class="title">PM Report</text>
<text x="1390.0" y="501" text-anchor="middle" class="subtitle">Client-ready narrative</text>
</g>

  <line x1="410" y1="495" x2="520" y2="495" class="arrow" marker-end="url(#arrowhead)"/>
<text x="465.0" y="481" text-anchor="middle" class="label">requirements</text>
  <line x1="800" y1="495" x2="910" y2="495" class="arrow" marker-end="url(#arrowhead)"/>
<text x="855.0" y="481" text-anchor="middle" class="label">analysis ask</text>
  <line x1="1190" y1="495" x2="1300" y2="495" class="arrow" marker-end="url(#arrowhead)"/>
<text x="1245.0" y="481" text-anchor="middle" class="label">approved findings</text>
  <path d="M1050 578 C1050 654 660 654 660 578" class="loop" marker-end="url(#arrowhead)"/>
  <text x="855" y="680" text-anchor="middle" class="label">BA feedback loop for recalculation</text>

  <rect x="60" y="664" width="1480" height="150" rx="16" class="band"/>
  <text x="88" y="700" class="band-title">Shared Context and Artifacts</text>
  <g>
<rect x="130" y="724" width="260" height="62" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="130" y="724" width="260" height="7" rx="3.5" fill="#7c3aed"/>
<text x="260.0" y="762" text-anchor="middle" class="title">RAG Store</text>
<text x="260.0" y="793" text-anchor="middle" class="subtitle">retrieved document context</text>
</g>
  <g>
<rect x="450" y="724" width="260" height="62" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="450" y="724" width="260" height="7" rx="3.5" fill="#f59e0b"/>
<text x="580.0" y="762" text-anchor="middle" class="title">Column Profile</text>
<text x="580.0" y="793" text-anchor="middle" class="subtitle">schema, types, missingness</text>
</g>
  <g>
<rect x="770" y="724" width="260" height="62" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="770" y="724" width="260" height="7" rx="3.5" fill="#f59e0b"/>
<text x="900.0" y="762" text-anchor="middle" class="title">Numeric Summaries</text>
<text x="900.0" y="793" text-anchor="middle" class="subtitle">aggregates, comparisons</text>
</g>
  <g>
<rect x="1090" y="724" width="260" height="62" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
<rect x="1090" y="724" width="260" height="7" rx="3.5" fill="#f59e0b"/>
<text x="1220.0" y="762" text-anchor="middle" class="title">Chart Artifacts</text>
<text x="1220.0" y="793" text-anchor="middle" class="subtitle">paths and chart summaries</text>
</g>

  <line x1="260" y1="724" x2="260" y2="558" class="arrow dashed" marker-end="url(#arrowhead)"/>
<text x="260.0" y="710" text-anchor="middle" class="label">context</text>
  <line x1="580" y1="724" x2="1000" y2="558" class="arrow dashed" marker-end="url(#arrowhead)"/>
<text x="790.0" y="710" text-anchor="middle" class="label">columns</text>
  <line x1="900" y1="724" x2="660" y2="558" class="arrow dashed" marker-end="url(#arrowhead)"/>
<text x="780.0" y="710" text-anchor="middle" class="label">evidence</text>
  <line x1="1220" y1="724" x2="660" y2="558" class="arrow dashed" marker-end="url(#arrowhead)"/>
<text x="940.0" y="710" text-anchor="middle" class="label">charts</text>

  <rect x="470" y="842" width="660" height="50" rx="12" class="boundary"/>
  <text x="800" y="873" text-anchor="middle" class="boundary-text">Raw tables stay inside DA tooling. LLM agents see profiles, summaries, chart notes, and retrieved context.</text>
</svg>
